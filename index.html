<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#086432"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png" type="image/png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Linah Training"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Linah Farms Technical Training</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gb:#0d3d22;--on:#fff;--g:#8fd14f;--au:#9ed84f;--bg:#070907;--c:#101410;--t:#edf2ea;--m:#93a08d;--b:rgba(158,216,79,.16);--er:#ef8f84;--ok:#8fd14f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gb:#0d3d22;--on:#fff;--g:#8fd14f;--au:#9ed84f;--bg:#070907;--c:#101410;--t:#edf2ea;--m:#93a08d;--b:rgba(158,216,79,.16);--er:#ef8f84;--ok:#8fd14f}}
:root[data-theme="dark"]{--gb:#0d3d22;--on:#fff;--g:#8fd14f;--au:#9ed84f;--bg:#070907;--c:#101410;--t:#edf2ea;--m:#93a08d;--b:rgba(158,216,79,.16);--er:#ef8f84;--ok:#8fd14f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.7}
header{background:var(--c);color:var(--g);box-shadow:0 1px 12px rgba(158,216,79,.08);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--au);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1;font-size:15px;color:var(--g);white-space:nowrap}@media(max-width:520px){.nm{display:none}}.lp{background:#fff;border-radius:10px;padding:3px 8px;display:inline-flex;align-items:center;flex:none}.lp.av{cursor:pointer;position:relative}.lp.av:after{content:'✎';position:absolute;bottom:-4px;left:-4px;background:var(--au);color:#0d3d22;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}.lp img{display:block}.lk{display:inline-block;background:#fff;padding:12px 22px;border-radius:16px;border:1px solid var(--b);margin-bottom:6px}.lk img{display:block}.card.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gb);color:var(--on);border:0;border-bottom:4px solid var(--au)}.card.hero h2,.card.hero p{color:var(--on);margin:.15em 0}footer{max-width:980px;margin:12px auto;padding:10px;text-align:center;color:var(--m);font-size:12px}footer:before{content:"";display:block;height:3px;width:64px;background:var(--au);margin:0 auto 8px;border-radius:2px}.nm{font-size:13px;opacity:.9}
main{max-width:980px;margin:auto;padding:14px}
h1,h2,h3,h4{margin:.5em 0 .3em;color:var(--g)}h3{font-size:17px}
.card{background:var(--c);border:1px solid var(--b);box-shadow:0 1px 0 rgba(158,216,79,.04),inset 0 1px 0 rgba(255,255,255,.02);border-radius:10px;padding:12px 14px;margin:10px 0}
.m{color:var(--m);font-size:13px;margin:.2em 0}.ok{color:var(--ok)}.er{color:var(--er)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kp .card{margin:0;text-align:center}.n{font-size:26px;font-weight:700;color:var(--g)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.gr .card{margin:0}
.bar{height:8px;background:rgba(158,216,79,.12);border-radius:4px;flex:1;min-width:60px;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0d3d22,var(--au));border-radius:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}.row>span:first-child{flex:1}
.b{font:inherit;background:var(--gb);color:var(--on);border:1px solid rgba(158,216,79,.35);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-block;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.b.o{background:transparent;color:var(--g)}.b.s{padding:3px 10px;font-size:13px}
.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabs button:focus-visible{outline:3px solid var(--g);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);margin:2px 0 8px}
.row input{flex:1;width:auto;margin:0}label{font-size:13px;color:var(--m)}label.op{display:flex;gap:8px;align-items:center;color:var(--t);font-size:15px;padding:4px 0}label.op input{width:auto;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{font:inherit;background:var(--c);color:var(--g);border:1px solid var(--b);border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap}.tabs .on{background:var(--gb);color:var(--on)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;background:var(--c)}th,td{border:1px solid var(--b);padding:6px 8px;text-align:right;white-space:nowrap}th{background:var(--bg);color:var(--g)}
.lg{max-width:420px;margin:auto;padding:28px 16px;text-align:center}.logo{font-size:52px}.lg h1{font-size:22px;line-height:1.3;margin:.2em 0}.lg small{color:var(--au);font-size:16px;letter-spacing:.5px}.lg .card{text-align:right}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
.cw{background:var(--c);border-radius:12px;padding:16px;width:100%;max-width:560px}
.cert{background:#fff;color:#17231d;border:6px double #086432;padding:6px;text-align:center}.cb{border:2px solid #80bb08;padding:16px 10px}.cert h1,.cert h2,.cert h3{color:#086432;margin:.2em}.cert p{margin:.2em}
.qf{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px;font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gb);color:var(--on);padding:8px 16px;border-radius:8px;z-index:20}
@media print{.noprint,.tabs,header,footer,.toast{display:none!important}body.pc main{display:none}.modal{position:static!important;background:none!important;padding:0}.cw{padding:0;max-width:none}}
.stars{display:flex;gap:4px;font-size:22px;direction:ltr;justify-content:flex-end}.stars button{background:none;border:none;color:var(--b);cursor:pointer;padding:2px;font:inherit}.stars button.on{color:var(--au)}.rt-badge{color:var(--au);font-weight:700}.b.startb{background:#c0392b;border-color:rgba(255,255,255,.25)}</style></head><body><div id="app"></div>

if(m.k=='pdf')return `<div class="card row"><span>${ic.pdf} ${E(m.t)}</span><span><button class="b s o" onclick="viewPdf('${E(m.u)}')">عرض</button> <a href="${E(m.u)}" download="${E(m.t)}.pdf">تحميل</a></span></div>`
return `<div class="card row"><span>${ic.link} ${E(m.t)}</span><span><a href="${E(m.u)}" target="_blank" rel="noopener">فتح</a></span></div>`}
function viewPdf(u){S.m=`<div class="modal"><div class="cw" style="max-width:900px"><div class="row noprint"><button class="b s o" onclick="cm()">إغلاق</button></div><iframe src="${E(u)}" style="width:100%;height:75vh;border:0;border-radius:8px;background:#fff"></iframe></div></div>`;R()}
function mf(id){const c=db.c.find(x=>x.id==id);form('إضافة مادة تدريبية',[['k','النوع','sel',[['pdf','ملف PDF'],['video','فيديو (رابط)'],['link','رابط خارجي']]],['t','العنوان','text'],['u','الرابط (أو ارفع ملف PDF بالأسفل)','text'],['f','ملف PDF (حتى 1 ميجا تقريبًا)','file']],{k:'pdf',t:'',u:''},async x=>{const u=x.f||x.u.trim();if(!x.t.trim()||!/^(https?:\/\/|data:application\/pdf)/i.test(u))return'أدخل عنوانًا ورابطًا يبدأ بـ http أو ملف PDF';if(x.f.length>1.5e6)return'الملف كبير (الحد نحو 1 ميجا)، استخدم رابطًا';const r=await rpc('app_add_material',{p_token:S.t,p_course:id,p_kind:x.k,p_title:x.t.trim(),p_url:u});return r.ok?0:'تعذر الحفظ'})}
const dm=async(id,mid)=>{try{await rpc('app_delete_material',{p_token:S.t,p_id:mid});await load();R()}catch(e){toast('تعذر الحذف')}};
const crsH=()=>`<div class="row noprint"><button class="b" onclick="cf()">إضافة دورة</button></div><div class="gr">${db.c.map(c=>`<div class="card"><b>${E(c.t)}</b><p class="m">${c.l.length} دروس، ${c.q.length} أسئلة، ${c.lv.length} مستوى</p>${c.m.map((m,i)=>`<p class="m">${ic[m.k]} ${E(m.t)} <a href="#" onclick="dm('${c.id}','${m.id}');return false">حذف</a></p>`).join('')}<div class="row"><button class="b s" onclick="cf('${c.id}')">تعديل</button><button class="b s o" onclick="mf('${c.id}')">إضافة مادة</button><button class="b s o" onclick="del('c','${c.id}')">حذف</button></div></div>`).join('')}</div>`;
const fbkH=()=>`<div class="gr">${(db.fb||[]).map(x=>`<div class="card"><b>${E(x.name)}</b> <span class="m">(${E(x.code)}) — ${x.dt}</span><p>${E(x.msg)}</p></div>`).join('')||'<p class="m">لا توجد ملاحظات بعد.</p>'}</div>`;
const cerH=()=>`<div class="sc"><table><tr><th>الرقم<th>المتدرب<th>الدورة<th>الدرجة<th>التاريخ<th></tr>${db.certs.map(x=>{const{u,c}=cd(x.no);return`<tr><td>${x.no}<td>${E(u.name)}<td>${E(c.t)}<td>${x.sc}%<td>${x.dt}<td><button class="b s" onclick="showCert('${x.no}')">عرض</button></tr>`}).join('')||'<tr><td>لا توجد شهادات بعد.</tr>'}</table></div>`;
async function del(k,id){if(S.dk!=k+id){S.dk=k+id;setTimeout(()=>S.dk='',4000);return toast('اضغط حذف مرة أخرى للتأكيد')}S.dk='';
try{const r=k=='u'?await rpc('app_delete_employee',{p_token:S.t,p_code:id}):await rpc('app_delete_course',{p_token:S.t,p_course:id});
if(!r.ok)return toast(r.error=='self'?'لا يمكنك حذف حسابك':r.error=='last_admin'?'لا يمكن حذف آخر Admin':'تعذر الحذف');await load();R();toast('تم الحذف')}catch(e){toast('تعذر الحذف')}}
function adminH(){const T=S.u.role=='Trainer'?[['rep','التقارير'],['crs','الدورات']]:[['rep','التقارير'],['emp','العاملون'],['crs','الدورات'],['cer','الشهادات'],['fbk','الملاحظات']];if(!T.some(t=>t[0]==S.tab))S.tab=T[0][0];
return`<nav class="tabs">${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';R()">${t[1]}</button>`).join('')}</nav><p class="m">${E(S.u.name)}، الصلاحية: ${S.u.role}</p>`+({rep:repH,emp:empH,crs:crsH,cer:cerH,fbk:fbkH}[S.tab])()}
function R(){$('#app').innerHTML=S.u?head()+'<main>'+(S.c?courseH():S.u.role=='Employee'?homeH():adminH())+'</main>'+FT+S.m:loginH()+FT;
if(S.cn&&window.QRCode&&$('#qr')){const{x,u,c}=cd(S.cn);new QRCode($('#qr'),{text:location.origin+location.pathname+'?verify='+x.no,width:90,height:90})}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
