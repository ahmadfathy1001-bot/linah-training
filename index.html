<style>
:root{--gb:#0d3d22;--on:#fff;--g:#8fd14f;--au:#9ed84f;--bg:#070907;--c:#101410;--t:#edf2ea;--m:#93a08d;--b:rgba(158,216,79,.16);--er:#ef8f84;--ok:#8fd14f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gb:#0d3d22;--on:#fff;--g:#8fd14f;--au:#9ed84f;--bg:#070907;--c:#101410;--t:#edf2ea;--m:#93a08d;--b:rgba(158,216,79,.16);--er:#ef8f84;--ok:#8fd14f}}
:root[data-theme="dark"]{--gb:#0d3d22;--on:#fff;--g:#8fd14f;--au:#9ed84f;--bg:#070907;--c:#101410;--t:#edf2ea;--m:#93a08d;--b:rgba(158,216,79,.16);--er:#ef8f84;--ok:#8fd14f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.7}
header{background:var(--c);color:var(--g);box-shadow:0 1px 12px rgba(158,216,79,.08);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--au);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1;font-size:15px;color:var(--g);white-space:nowrap}@media(max-width:520px){.nm{display:none}}.lp{background:#fff;border-radius:10px;padding:3px 8px;display:inline-flex;align-items:center;flex:none}.lp.av{cursor:pointer;position:relative}.lp.av:after{content:'✎';position:absolute;bottom:-4px;left:-4px;background:var(--au);color:#0d3d22;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}.lp img{display:block}.lk{display:inline-block;background:#fff;padding:12px 22px;border-radius:16px;border:1px solid var(--b);margin-bottom:6px}.lk img{display:block}.card.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,rgba(8,20,10,.72),rgba(8,20,10,.55)),var(--herobg) center/cover;color:var(--on);border:0;border-bottom:4px solid var(--au)}.card.hero h2,.card.hero p{color:var(--on);margin:.15em 0}footer{max-width:980px;margin:12px auto;padding:10px;text-align:center;color:var(--m);font-size:12px}footer:before{content:"";display:block;height:3px;width:64px;background:var(--au);margin:0 auto 8px;border-radius:2px}.nm{font-size:13px;opacity:.9}
main{max-width:980px;margin:auto;padding:14px}
h1,h2,h3,h4{margin:.5em 0 .3em;color:var(--g)}h3{font-size:17px}
.card{background:var(--c);border:1px solid var(--b);box-shadow:0 1px 0 rgba(158,216,79,.04),inset 0 1px 0 rgba(255,255,255,.02);border-radius:10px;padding:12px 14px;margin:10px 0}
.m{color:var(--m);font-size:13px;margin:.2em 0}.ok{color:var(--ok)}.er{color:var(--er)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kp .card{margin:0;text-align:center}.n{font-size:26px;font-weight:700;color:var(--g)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.gr .card{margin:0}
.bar{height:8px;background:rgba(158,216,79,.12);border-radius:4px;flex:1;min-width:60px;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0d3d22,var(--au));border-radius:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}.row>span:first-child{flex:1}
.b{font:inherit;background:var(--gb);color:var(--on);border:1px solid rgba(158,216,79,.35);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-block;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.b.o{background:transparent;color:var(--g)}.b.s{padding:3px 10px;font-size:13px}
.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabs button:focus-visible{outline:3px solid var(--g);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);margin:2px 0 8px}
.row input{flex:1;width:auto;margin:0}label{font-size:13px;color:var(--m)}label.op{display:flex;gap:8px;align-items:center;color:var(--t);font-size:15px;padding:4px 0}label.op input{width:auto;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{font:inherit;background:var(--c);color:var(--g);border:1px solid var(--b);border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap}.tabs .on{background:var(--gb);color:var(--on)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;background:var(--c)}th,td{border:1px solid var(--b);padding:6px 8px;text-align:right;white-space:nowrap}th{background:var(--bg);color:var(--g)}
.lghero{min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,rgba(6,9,6,.35) 0%,rgba(6,9,6,.55) 45%,rgba(6,9,6,.92) 78%,#070907 100%),var(--bgimg) center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:0}
.lghero .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 0}
.lghero .brand img{height:34px;background:#fff;border-radius:6px;padding:3px 6px}
.lghero .tagline{padding:10px 20px 18px;text-align:center}
.lghero .tagline h1{font-size:30px;line-height:1.35;color:#fff;margin:0 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.lghero .tagline p{color:#dfe9d8;font-size:14px;margin:0}
.lg{max-width:460px;margin:auto;padding:0 16px 28px;text-align:center}
.lg .card{text-align:right;background:rgba(16,20,16,.82);backdrop-filter:blur(6px);border-color:rgba(158,216,79,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
.cw{background:var(--c);border-radius:12px;padding:16px;width:100%;max-width:560px}
.cert{background:#fdfdf8;color:#17231d;border:10px solid #086432;outline:2px solid #80bb08;outline-offset:-16px;padding:10px;text-align:center;position:relative;font-family:Georgia,'Times New Roman',serif}
.cb{border:1px solid #cdd9c3;padding:26px 18px;position:relative}
.cert h1,.cert h2,.cert h3{color:#086432;margin:.25em}
.cert h1{font-size:28px;border-bottom:2px solid #80bb08;display:inline-block;padding-bottom:6px}
.cert p{margin:.3em;color:#3a4a3f}
.cert .kicker{letter-spacing:3px;font-size:11px;color:#80bb08;font-weight:700;text-transform:uppercase}
.cert .seal{position:absolute;top:14px;left:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9ed84f,#086432);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cert .sig{margin-top:22px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px}
.cert .sig div{text-align:center;font-size:12px;color:#3a4a3f}
.cert .sig .line{width:130px;border-top:1px solid #888;margin-bottom:4px}
.cert .corner{position:absolute;width:22px;height:22px;border:3px solid #80bb08}
.cert .c1{top:4px;left:4px;border-left:3px solid #80bb08;border-top:3px solid #80bb08;border-right:0;border-bottom:0}
.cert .c2{top:4px;right:4px;border-right:3px solid #80bb08;border-top:3px solid #80bb08;border-left:0;border-bottom:0}
.cert .c3{bottom:4px;left:4px;border-left:3px solid #80bb08;border-bottom:3px solid #80bb08;border-right:0;border-top:0}
.cert .c4{bottom:4px;right:4px;border-right:3px solid #80bb08;border-bottom:3px solid #80bb08;border-left:0;border-top:0}
.qf{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px;font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gb);color:var(--on);padding:8px 16px;border-radius:8px;z-index:20}
.print-head{display:none}
@media print{
.noprint,.tabs,header,footer,.toast{display:none!important}
body.pc main{display:none}
.modal{position:static!important;background:none!important;padding:0}
.cw{padding:0;max-width:none}
body{background:#fff!important;color:#111!important}
.card{background:#fff!important;border:1px solid #ccc!important;box-shadow:none!important;color:#111!important}
.n,h1,h2,h3,h4,b{color:#086432!important}
.m{color:#555!important}
.bar{background:#e5e5e5!important}.bar i{background:#086432!important}
.print-head{display:flex!important;align-items:center;gap:10px;border-bottom:3px solid #80bb08;padding-bottom:10px;margin-bottom:12px}
.print-head img{height:44px}
}
.stars{display:flex;gap:4px;font-size:22px;direction:ltr;justify-content:flex-end}.stars button{background:none;border:none;color:var(--b);cursor:pointer;padding:2px;font:inherit}.stars button.on{color:var(--au)}.rt-badge{color:var(--au);font-weight:700}.b.startb{background:#c0392b;border-color:rgba(255,255,255,.25)}
.sk{background:linear-gradient(90deg,var(--b) 25%,rgba(158,216,79,.25) 50%,var(--b) 75%);background-size:200% 100%;animation:skshine 1.4s infinite;border-radius:6px}
.sk-card{pointer-events:none}

return `<div class="row noprint"><button class="b" onclick="doBackup()">تنزيل نسخة احتياطية (JSON)</button></div>
<h3>حسابات موقوفة أو بها محاولات دخول فاشلة</h3><div class="card">${a.locked.length?a.locked.map(x=>`<div class="row"><span>${E(x.name)} (${E(x.code)})</span><span class="m">${x.failed} محاولة${x.until?'، موقوف حتى '+x.until:''}</span></div>`).join(''):'<p class="m">لا شيء غير طبيعي حاليًا.</p>'}</div>
<h3>الجلسات النشطة الآن</h3><div class="card">${a.sessions.length?a.sessions.map(x=>`<div class="row"><span>${E(x.name)} (${E(x.code)})</span><span><span class="m">منذ ${x.since}</span> <button class="b s o" onclick="revokeSess('${x.code}')">إنهاء</button></span></div>`).join(''):'<p class="m">لا جلسات نشطة.</p>'}</div>
<h3>سجل النشاط الإداري (آخر 100)</h3><div class="sc"><table><tr><th>التاريخ<th>من<th>الإجراء<th>على<th>تفاصيل<tr>${a.log.map(x=>`<tr><td>${x.dt}<td>${E(x.actor)}<td>${E(x.action)}<td>${E(x.target||'')}<td>${E(x.details||'')}</tr>`).join('')}</table></div>`}
async function revokeSess(code){confirmBox(`إنهاء كل جلسات "${code}"؟ سيُطلب منه تسجيل الدخول من جديد.`,`revokeSessReal('${code}')`)}
async function revokeSessReal(code){try{await rpc('app_revoke_session',{p_token:S.t,p_code:code});await load();R();toast('تم إنهاء الجلسة')}catch(e){toast('تعذر التنفيذ')}}
async function doBackup(){try{const r=await rpc('app_backup_json',{p_token:S.t});const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='linah-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}catch(e){toast('تعذر إنشاء النسخة الاحتياطية')}}
const fbkH=()=>`<div class="gr">${(db.fb||[]).map(x=>`<div class="card"><b>${E(x.name)}</b> <span class="m">(${E(x.code)}) — ${x.dt}</span><p>${E(x.msg)}</p></div>`).join('')||'<p class="m">لا توجد ملاحظات بعد.</p>'}</div>`;
const cerH=()=>`<div class="sc"><table><tr><th>الرقم<th>المتدرب<th>الدورة<th>الدرجة<th>التاريخ<th></tr>${db.certs.map(x=>{const{u,c}=cd(x.no);return`<tr><td>${x.no}<td>${E(u.name)}<td>${E(c.t)}<td>${x.sc}%<td>${x.dt}<td><button class="b s" onclick="showCert('${x.no}')">عرض</button></tr>`}).join('')||'<tr><td>لا توجد شهادات بعد.</tr>'}</table></div>`;
function confirmBox(msg,action){S.m=`<div class="modal"><div class="cw"><h3>تأكيد الحذف</h3><p>${E(msg)}</p><div class="row"><button class="b" style="background:var(--er);border-color:var(--er)" onclick="${action};cm()">نعم، احذف</button><button class="b o" onclick="cm()">إلغاء</button></div></div></div>`;R()}
function del(k,id,label){confirmBox(`هل تريد حذف "${label||id}"؟ لا يمكن التراجع عن هذا الإجراء.`, `delReal('${k}','${id}')`)}
async function delReal(k,id){
try{const r=k=='u'?await rpc('app_delete_employee',{p_token:S.t,p_code:id}):await rpc('app_delete_course',{p_token:S.t,p_course:id});
if(!r.ok)return toast(r.error=='self'?'لا يمكنك حذف حسابك':r.error=='last_admin'?'لا يمكن حذف آخر Admin':'تعذر الحذف');await load();R();toast('تم الحذف')}catch(e){toast('تعذر الحذف')}}
function adminH(){const T=S.u.role=='Trainer'?[['rep','التقارير'],['crs','الدورات'],['att','الحضور الميداني']]:[['rep','التقارير'],['emp','العاملون'],['crs','الدورات'],['cer','الشهادات'],['fbk','الملاحظات'],['att','الحضور الميداني'],...(S.u.role=='Admin'?[['sec','الأمان']]:[])];if(!T.some(t=>t[0]==S.tab))S.tab=T[0][0];
return`<nav class="tabs">${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';R()">${t[1]}</button>`).join('')}</nav><p class="m">${E(S.u.name)}، الصلاحية: ${S.u.role}</p>`+({rep:repH,emp:empH,crs:crsH,cer:cerH,fbk:fbkH,att:attH,sec:secH}[S.tab])()}
let NAV_PREV=0,NAV_INPOP=false;
function navSync(){const now=(S.c?1:0)+(S.m?1:0);if(NAV_INPOP){NAV_PREV=now;return}if(now>NAV_PREV)history.pushState({d:now},'');NAV_PREV=now}
window.addEventListener('popstate',()=>{NAV_INPOP=true;if(S.m){S.m=''}else if(S.c){S.c=null;S.ex=null}R();NAV_INPOP=false});
function R(){$('#app').innerHTML=S.u?`<div class="print-head"><img src="${LOCKUP}" alt="Linah Farms"><b>Linah Farms Technical Training</b></div>`+head()+'<main>'+(S.c?courseH():S.u.role=='Employee'?homeH():adminH())+'</main>'+FT+S.m:loginH()+FT;
if(S.cn&&window.QRCode&&$('#qr')){const{x,u,c}=cd(S.cn);new QRCode($('#qr'),{text:location.origin+location.pathname+'?verify='+x.no,width:90,height:90})}
navSync()}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
